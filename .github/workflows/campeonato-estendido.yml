name: Campeonato Estendido Scouts V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/construir_dataset.py'
      - 'scripts/auditar_previsoes_imutaveis.py'
      - 'scripts/benchmark_scouts_estendido.py'
      - 'scripts/backtest_v3s_catboost_nested.py'
      - 'scripts/backtest_v3s_dois_estagios.py'
      - 'scripts/ablation_participacao_enriquecida.py'
      - 'scripts/ablation_descanso_brasileirao.py'
      - 'scripts/coletar_calendario_externo_2026.py'
      - 'scripts/ablation_calendario_externo.py'
      - 'scripts/executar_ablation_calendario_externo.py'
      - 'scripts/ablation_mudanca_tecnico.py'
      - 'scripts/ablation_horario_partida.py'
      - 'scripts/resumir_contextos.py'
      - 'data/context/mudancas-tecnicos-2026.json'
      - 'scripts/calibrar_participacao_dois_estagios.py'
      - 'scripts/calibrar_producao_condicional_dois_estagios.py'
      - 'scripts/ablation_contexto.py'
      - 'scripts/validar_gate_contexto_catboost.py'
      - 'scripts/ablation_catboost_contexto_nested.py'
      - 'scripts/comparar_catboost_off_v2.py'
      - 'scripts/ranking_arquiteturas_comum.py'
      - 'scripts/seletor_posicional_temporal.py'
      - 'scripts/holdout_posicional_catboost_v2.py'
      - 'scripts/resumir_catboost_nested.py'
      - 'scripts/calibrar_catboost_nested_temporal.py'
      - 'scripts/seletor_nested_calibracao_catboost.py'
      - 'scripts/meta_seletor_final_temporal.py'
      - 'scripts/gerar_painel.py'
      - 'requirements-extended.txt'
      - '.github/workflows/campeonato-estendido.yml'
  schedule:
    - cron: '40 10 * * 1'
concurrency:
  group: campeonato-estendido-scouts-v3
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  campeonato-estendido:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar challengers pesados
        run: pip install -r requirements-extended.txt
      - name: Sincronizar base somente leitura da V2
        run: python scripts/sincronizar_base_v2.py
      - name: Construir dataset anti-leakage
        run: python scripts/construir_dataset.py
      - name: Auditar corte temporal antes do campeonato
        run: python scripts/auditar_vazamento_temporal.py
      - name: Auditar previsoes pre-rodada imutaveis
        run: python scripts/auditar_previsoes_imutaveis.py
      - name: Testar sinais históricos enriquecidos de participação
        run: python scripts/ablation_participacao_enriquecida.py
      - name: Testar descanso entre jogos do Brasileirao
        run: python scripts/ablation_descanso_brasileirao.py
      - name: Coletar snapshot de Libertadores Sul-Americana e Copa do Brasil
        run: python scripts/coletar_calendario_externo_2026.py
      - name: Testar congestionamento de calendario externo
        run: python scripts/executar_ablation_calendario_externo.py
      - name: Testar efeito de mudanca de tecnico
        run: python scripts/ablation_mudanca_tecnico.py
      - name: Testar efeito do horario da partida
        run: python scripts/ablation_horario_partida.py
      - name: Gerar resumo compacto das ablations de contexto
        run: python scripts/resumir_contextos.py
      - name: Revalidar contexto em walk-forward estrito
        run: python scripts/ablation_contexto.py
      - name: Aplicar gate cientifico de contexto no CatBoost
        run: python scripts/validar_gate_contexto_catboost.py
      - name: Rodar XGBoost LightGBM CatBoost
        run: python scripts/benchmark_scouts_estendido.py
      - name: Rodar CatBoost em nested walk-forward estrito
        run: python scripts/backtest_v3s_catboost_nested.py
      - name: Rodar V3 Scouts em dois estágios participação x produção
        run: python scripts/backtest_v3s_dois_estagios.py
      - name: Calibrar participação em nested temporal estrito
        run: python scripts/calibrar_participacao_dois_estagios.py
      - name: Calibrar produção condicional em nested temporal estrito
        run: python scripts/calibrar_producao_condicional_dois_estagios.py
      - name: Isolar ganho do contexto dentro do CatBoost
        run: python scripts/ablation_catboost_contexto_nested.py
      - name: Comparar CatBoost OFF calibrado com V2 oficial
        run: python scripts/comparar_catboost_off_v2.py
      - name: Rankear V2 V3 e CatBoost na mesma intersecao
        run: python scripts/ranking_arquiteturas_comum.py
      - name: Testar seletor posicional temporal anti-leakage
        run: python scripts/seletor_posicional_temporal.py
      - name: Testar holdout posicional congelado V2 vs CatBoost
        run: python scripts/holdout_posicional_catboost_v2.py
      - name: Resumir CatBoost nested e aplicar guardrails
        run: python scripts/resumir_catboost_nested.py
      - name: Testar calibracao residual temporal do CatBoost
        run: python scripts/calibrar_catboost_nested_temporal.py
      - name: Selecionar calibracao em nested temporal estrito
        run: python scripts/seletor_nested_calibracao_catboost.py
      - name: Rodar meta-seletor final V2 V3-H CatBoost
        run: python scripts/meta_seletor_final_temporal.py
      - name: Atualizar dados do painel com resultados estendidos
        run: python scripts/gerar_painel.py
      - name: Validar integridade dos relatórios gerados
        shell: bash
        run: |
          set -euo pipefail
          REPORTS=(
            data/context/calendario-externo-2026.json
            data/context/mudancas-tecnicos-2026.json
            data/reports/auditoria-previsoes-imutaveis.json
            data/reports/ablation-participacao-enriquecida.json
            data/reports/ablation-descanso-brasileirao.json
            data/reports/ablation-calendario-externo.json
            data/reports/ablation-mudanca-tecnico.json
            data/reports/ablation-horario-partida.json
            data/reports/resumo-contextos.json
            data/reports/ablation-contexto.json
            data/reports/gate-contexto-catboost.json
            data/reports/ablation-catboost-contexto-nested.json
            data/reports/comparacao-catboost-off-v2.json
            data/reports/ranking-arquiteturas-comum.json
            data/reports/seletor-posicional-temporal.json
            data/reports/holdout-posicional-catboost-v2.json
            data/reports/campeonato-modelos-estendido.json
            data/reports/backtest-v3s-catboost-nested.json
            data/reports/backtest-v3s-dois-estagios.json
            data/reports/calibracao-participacao-dois-estagios.json
            data/reports/calibracao-producao-condicional-dois-estagios.json
            data/reports/resumo-catboost-nested.json
            data/reports/calibracao-catboost-nested-temporal.json
            data/reports/calibracao-catboost-nested-resumo.json
            data/reports/seletor-nested-calibracao-catboost.json
            data/reports/meta-seletor-final-temporal.json
            site/dados.json
          )
          for path in "${REPORTS[@]}"; do
            test -s "$path" || { echo "Relatório ausente ou vazio: $path" >&2; exit 1; }
            python -m json.tool "$path" >/dev/null
          done
          echo 'Integridade dos relatórios: APROVADA'
      - name: Publicar relatórios e painel V3 com retry transacional
        shell: bash
        run: |
          set -euo pipefail
          REPORTS=(
            data/context/calendario-externo-2026.json
            data/context/mudancas-tecnicos-2026.json
            data/reports/auditoria-previsoes-imutaveis.json
            data/reports/ablation-participacao-enriquecida.json
            data/reports/ablation-descanso-brasileirao.json
            data/reports/ablation-calendario-externo.json
            data/reports/ablation-mudanca-tecnico.json
            data/reports/ablation-horario-partida.json
            data/reports/resumo-contextos.json
            data/reports/ablation-contexto.json
            data/reports/gate-contexto-catboost.json
            data/reports/ablation-catboost-contexto-nested.json
            data/reports/comparacao-catboost-off-v2.json
            data/reports/ranking-arquiteturas-comum.json
            data/reports/seletor-posicional-temporal.json
            data/reports/holdout-posicional-catboost-v2.json
            data/reports/campeonato-modelos-estendido.json
            data/reports/backtest-v3s-catboost-nested.json
            data/reports/backtest-v3s-dois-estagios.json
            data/reports/calibracao-participacao-dois-estagios.json
            data/reports/calibracao-producao-condicional-dois-estagios.json
            data/reports/resumo-catboost-nested.json
            data/reports/calibracao-catboost-nested-temporal.json
            data/reports/calibracao-catboost-nested-resumo.json
            data/reports/seletor-nested-calibracao-catboost.json
            data/reports/meta-seletor-final-temporal.json
            site/dados.json
          )

          SNAPSHOT="$(mktemp -d)"
          trap 'rm -rf "$SNAPSHOT"' EXIT
          for path in "${REPORTS[@]}"; do
            if [[ -f "$path" ]]; then
              mkdir -p "$SNAPSHOT/$(dirname "$path")"
              cp "$path" "$SNAPSHOT/$path"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for tentativa in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            for path in "${REPORTS[@]}"; do
              if [[ -f "$SNAPSHOT/$path" ]]; then
                mkdir -p "$(dirname "$path")"
                cp "$SNAPSHOT/$path" "$path"
              fi
            done

            git add "${REPORTS[@]}"
            if git diff --cached --quiet; then
              echo 'Nenhum relatório ou dado de painel novo para publicar.'
              exit 0
            fi

            git commit -m 'data: atualizar campeonato estendido e painel v3'
            if git push origin HEAD:main; then
              echo "Relatórios e painel publicados na tentativa $tentativa."
              exit 0
            fi

            echo "main avançou durante a publicação; repetindo sobre o novo HEAD ($tentativa/4)."
          done

          echo 'Falha ao publicar relatórios após 4 tentativas sem sobrescrever main.' >&2
          exit 1
