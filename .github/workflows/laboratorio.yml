name: Laboratorio Scouts V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'requirements.txt'
      - 'requirements-extended.txt'
      - '.github/workflows/laboratorio.yml'
  schedule:
    - cron: '20 9 * * *'
concurrency:
  group: campeonato-estendido-scouts-v3
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias completas do laboratorio
        run: pip install -r requirements-extended.txt
      - name: Sincronizar historico sem escrever na V2
        run: python scripts/sincronizar_base_v2.py
      - name: Auditar scouts e regras
        run: python scripts/auditar_scouts.py
      - name: Construir dataset anti-leakage com universo completo
        run: python scripts/construir_dataset.py
      - name: Auditar universo de jogadores validos
        run: python scripts/auditar_universo_jogadores.py
      - name: Bloquear qualquer vazamento temporal
        run: python scripts/auditar_vazamento_temporal.py
      - name: Congelar previsao meteorologica antes da rodada
        run: python scripts/capturar_clima_pre_rodada.py
      - name: Auditar imutabilidade e corte temporal do clima
        run: python scripts/auditar_clima_pre_rodada.py
      - name: Ablation de mando e força de adversário
        run: python scripts/ablation_contexto.py
      - name: Ablation final das hipoteses por posicao
        run: python scripts/ablation_hipoteses_posicionais.py
      - name: Campeonato ampliado de modelos
        run: python scripts/benchmark_scouts.py
      - name: Auditar calibracao de scouts raros
        run: python scripts/auditar_eventos_raros.py
      - name: Aplicar guardrail diagnostico em scouts raros
        run: python scripts/guardrail_scouts_raros.py
      - name: Backtest arquitetural de pontos por scouts
        run: python scripts/backtest_pontos_scouts.py
      - name: Backtest nested V3 Scouts
        run: python scripts/backtest_v3s_nested.py
      - name: Validar guardrail raro em pontuacao total nested
        run: python scripts/backtest_v3s_guardrail_raros_nested.py
      - name: Gate estatistico do guardrail raro
        run: python scripts/gate_guardrail_raros.py
      - name: Calibrar participacao do modelo em dois estagios
        run: python scripts/calibrar_participacao_dois_estagios.py
      - name: Calibrar producao condicional do modelo em dois estagios
        run: python scripts/calibrar_producao_condicional_dois_estagios.py
      - name: Backtest nested do modelo em dois estagios
        run: python scripts/backtest_v3s_dois_estagios.py
      - name: Gate estatistico do modelo em dois estagios
        run: python scripts/gate_dois_estagios.py
      - name: Significancia estatistica das arquiteturas
        run: python scripts/significancia_arquiteturas.py
      - name: Comparar V2 historica salva contra V3
        run: python scripts/comparar_v2_oficial.py
      - name: Controlar multipla comparacao dos challengers
        run: python scripts/controle_multipla_comparacao.py
      - name: Meta seletor temporal V2 V3 por posicao
        run: python scripts/meta_seletor_v2_v3.py
      - name: Gerar ou validar lock pre-rodada imutavel
        run: python scripts/gerenciar_lock_pre_rodada.py
      - name: Auditar locks pre-rodada imutaveis
        run: python scripts/auditar_previsoes_imutaveis.py
      - name: Avaliar previsoes prospectivas ja resolvidas
        run: python scripts/avaliar_previsoes_prospectivas.py
      - name: Congelar decomposicao explicavel por scouts
        run: python scripts/gerar_explicabilidade_pre_rodada.py
      - name: Auditar explicabilidade sem informacao pos-rodada
        run: python scripts/auditar_explicabilidade_pre_rodada.py
      - name: Gerar painel
        run: python scripts/gerar_painel.py
      - name: Commit dos resultados reproduziveis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/derived data/reports predictions site/dados.json
          git diff --cached --quiet || git commit -m 'data: atualizar laboratorio scouts v3'
          git pull --rebase origin main
          git push
