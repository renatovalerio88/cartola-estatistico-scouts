name: Publicar painel V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/corrigir_cobertura_site.py'
      - 'scripts/gerar_payload_site_leve.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Laboratorio Scouts V3'
      - 'Campeonato Estendido Scouts V3'
      - 'Estudo Top 50 Liga Nacional'
      - 'Atualizar Site Produto V3'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Corrigir cobertura da interface
        shell: bash
        run: python scripts/corrigir_cobertura_site.py
      - name: Gerar payload leve do frontend
        shell: bash
        run: python scripts/gerar_payload_site_leve.py
      - name: Validar payload leve
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/dados-lite.json')
          if not p.exists():
              raise SystemExit('dados-lite.json ausente')
          size=p.stat().st_size
          if size>5_000_000:
              raise SystemExit(f'Payload leve acima do limite: {size} bytes')
          d=json.loads(p.read_text(encoding='utf-8'))
          required=['produto','explicabilidade_pre_rodada','avaliacao_prospectiva_imutavel','backtest_time_sugerido_walk_forward']
          missing=[k for k in required if k not in d]
          if missing:
              raise SystemExit('Campos obrigatorios ausentes: '+', '.join(missing))
          jogadores=d.get('produto',{}).get('jogadores') or []
          if not jogadores:
              raise SystemExit('produto.jogadores vazio')
          print(f'Payload leve validado: {size} bytes; {len(jogadores)} jogadores')
          PY
      - name: Aplicar acabamento final da interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          loader = '<script src="data-loader.js?v=20260913b"></script>'
          if 'data-loader.js?' not in html:
              html = html.replace('<script src="optimizer.js"></script>', loader + '<script src="optimizer.js"></script>')
          else:
              import re
              html = re.sub(r'<script src="data-loader\.js\?v=[^"]+"></script>', loader, html)
          tags = [
              '<script src="final-polish.js"></script>',
              '<script src="time-sugerido-final.js"></script>',
              '<script src="monte-premium.js?v=20260909b"></script>',
              '<script src="projecoes-premium.js?v=20260910a"></script>',
              '<script src="analise-premium.js?v=20260910a"></script>',
              '<script src="historico-premium.js?v=20260911b"></script>',
              '<script src="historico-final.js?v=20260911b"></script>',
              '<script src="metodologia-premium.js?v=20260911a"></script>',
              '<script src="ux-v2-bridge.js?v=20260913b"></script>',
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', tag + '</body>')
          if html.index('data-loader.js') > html.index('optimizer.js'):
              raise SystemExit('data-loader.js precisa carregar antes de optimizer.js')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Remover payload pesado do artefato público
        shell: bash
        run: rm -f site/dados.json
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
