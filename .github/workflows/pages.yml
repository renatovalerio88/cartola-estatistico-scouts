name: Publicar painel V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Laboratorio Scouts V3'
      - 'Campeonato Estendido Scouts V3'
      - 'Estudo Top 50 Liga Nacional'
      - 'Atualizar Site Produto V3'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Aplicar acabamento final da interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          tags = [
              '<script src="final-polish.js"></script>',
              '<script src="time-sugerido-final.js"></script>',
              '<script src="monte-premium.js?v=20260909b"></script>',
              '<script src="projecoes-premium.js?v=20260910a"></script>',
              '<script src="analise-premium.js?v=20260910a"></script>',
              '<script src="historico-premium.js?v=20260911b"></script>',
              '<script src="historico-final.js?v=20260911b"></script>',
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', tag + '</body>')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
