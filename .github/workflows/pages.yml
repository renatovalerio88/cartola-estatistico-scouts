# rollback estavel anterior ao historico detalhado
name: Publicar painel V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/corrigir_cobertura_site.py'
      - 'scripts/gerar_payload_site_leve.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Laboratorio Scouts V3'
      - 'Campeonato Estendido Scouts V3'
      - 'Estudo Top 50 Liga Nacional'
      - 'Atualizar Site Produto V3'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Corrigir cobertura da interface
        shell: bash
        run: python scripts/corrigir_cobertura_site.py
      - name: Gerar payload leve do frontend
        shell: bash
        run: python scripts/gerar_payload_site_leve.py
      - name: Validar payload leve
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('site/dados-lite.json')
          if not p.exists():
              raise SystemExit('dados-lite.json ausente')
          size = p.stat().st_size
          if size > 5_000_000:
              raise SystemExit(f'Payload leve acima do limite: {size} bytes')
          d = json.loads(p.read_text(encoding='utf-8'))
          required = ['produto','explicabilidade_pre_rodada','avaliacao_prospectiva_imutavel','backtest_time_sugerido_walk_forward']
          missing = [k for k in required if k not in d]
          if missing:
              raise SystemExit('Campos obrigatorios ausentes: ' + ', '.join(missing))
          jogadores = d.get('produto', {}).get('jogadores') or []
          if not jogadores:
              raise SystemExit('produto.jogadores vazio')
          print(f'Payload leve validado: {size} bytes; {len(jogadores)} jogadores')
          PY
      - name: Aplicar acabamento final da interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          loader = '<script src="data-fetch-bridge.js?v=20260914c"></script>'
          import re
          html = re.sub(r'<script src="data-fetch-bridge\.js\?v=[^"]+"></script>', '', html)
          html = html.replace('</head>', loader + '</head>')
          tags = [
              '<script src="final-polish.js"></script>',
              '<script src="time-sugerido-final.js"></script>',
              '<script src="monte-premium.js?v=20260909b"></script>',
              '<script src="projecoes-premium.js?v=20260910a"></script>',
              '<script src="analise-premium.js?v=20260910a"></script>',
              '<script src="historico-geral.js?v=20260914a"></script>',
              '<script src="metodologia-premium.js?v=20260911a"></script>',
              '<script src="ux-v2-bridge.js?v=20260912a"></script>',
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', tag + '</body>')
          if html.index('data-fetch-bridge.js') > html.index('</head>'):
              raise SystemExit('bridge precisa carregar no head')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Remover arquivos legados do artefato publico
        shell: bash
        run: rm -f site/dados.json site/historico-premium.js site/historico-final.js
      - name: Validar artefato antes do upload
        shell: bash
        run: |
          test -f site/dados-lite.json
          test ! -f site/dados.json
          test ! -f site/historico-premium.js
          test ! -f site/historico-final.js
          node --check site/data-fetch-bridge.js
          node --check site/optimizer.js
          node --check site/time-sugerido-final.js
          node --check site/monte-premium.js
          node --check site/projecoes-premium.js
          node --check site/analise-premium.js
          node --check site/historico-geral.js
          node --check site/metodologia-premium.js
          node --check site/ux-v2-bridge.js
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test do site publicado
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          code=""
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${base}?smoke=${GITHUB_RUN_ID}-${i}" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"
          grep -q 'data-fetch-bridge.js' /tmp/index.html
          grep -q 'historico-geral.js' /tmp/index.html
          ! grep -q 'historico-premium.js' /tmp/index.html
          ! grep -q 'historico-final.js' /tmp/index.html
          for page_id in time monte projecoes analise historico metodologia; do
            grep -q "id=\"${page_id}\"" /tmp/index.html
          done
          curl -L -sS --fail -o /tmp/dados-lite.json "${base}dados-lite.json?smoke=${GITHUB_RUN_ID}"
          python - <<'PY'
          import json, os
          p = '/tmp/dados-lite.json'
          size = os.path.getsize(p)
          if size > 5_000_000:
              raise SystemExit(f'Payload publicado acima do limite: {size}')
          d = json.load(open(p, encoding='utf-8'))
          players = d.get('produto', {}).get('jogadores') or []
          if not players:
              raise SystemExit('Sem jogadores no payload publicado')
          print(f'Smoke publicado OK: {size} bytes; {len(players)} jogadores')
          PY
          for legacy in dados.json historico-premium.js historico-final.js; do
            code_legacy=$(curl -L -sS -o /dev/null -w '%{http_code}' "${base}${legacy}?smoke=${GITHUB_RUN_ID}" || true)
            if [ "$code_legacy" = "200" ]; then
              echo "ERRO: ${legacy} ainda esta publico"
              exit 1
            fi
          done
          curl -L -sS -o /dev/null -w 'index: %{http_code} %{size_download} bytes em %{time_total}s\n' "${base}?perf=${GITHUB_RUN_ID}"
          curl -L -sS -o /dev/null -w 'payload: %{http_code} %{size_download} bytes em %{time_total}s\n' "${base}dados-lite.json?perf=${GITHUB_RUN_ID}"
