name: Publicar painel V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/corrigir_cobertura_site.py'
      - 'scripts/gerar_payload_site_leve.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Laboratorio Scouts V3'
      - 'Campeonato Estendido Scouts V3'
      - 'Estudo Top 50 Liga Nacional'
      - 'Atualizar Site Produto V3'
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Corrigir cobertura da interface
        shell: bash
        run: python scripts/corrigir_cobertura_site.py
      - name: Gerar payload leve do frontend
        shell: bash
        run: python scripts/gerar_payload_site_leve.py
      - name: Validar payload leve
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/dados-lite.json')
          if not p.exists():
              raise SystemExit('dados-lite.json ausente')
          size=p.stat().st_size
          if size>5_000_000:
              raise SystemExit(f'Payload leve acima do limite: {size} bytes')
          d=json.loads(p.read_text(encoding='utf-8'))
          required=['produto','explicabilidade_pre_rodada','avaliacao_prospectiva_imutavel','backtest_time_sugerido_walk_forward']
          missing=[k for k in required if k not in d]
          if missing:
              raise SystemExit('Campos obrigatorios ausentes: '+', '.join(missing))
          jogadores=d.get('produto',{}).get('jogadores') or []
          if not jogadores:
              raise SystemExit('produto.jogadores vazio')
          print(f'Payload leve validado: {size} bytes; {len(jogadores)} jogadores')
          PY
      - name: Aplicar acabamento final da interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          loader = '<script src="data-loader.js?v=20260913b"></script>'
          if 'data-loader.js?' not in html:
              html = html.replace('<script src="optimizer.js"></script>', loader + '<script src="optimizer.js"></script>')
          else:
              import re
              html = re.sub(r'<script src="data-loader\.js\?v=[^"]+"></script>', loader, html)
          tags = [
              '<script src="final-polish.js"></script>',
              '<script src="time-sugerido-final.js"></script>',
              '<script src="monte-premium.js?v=20260909b"></script>',
              '<script src="projecoes-premium.js?v=20260910a"></script>',
              '<script src="analise-premium.js?v=20260910a"></script>',
              '<script src="historico-premium.js?v=20260911b"></script>',
              '<script src="historico-final.js?v=20260911b"></script>',
              '<script src="metodologia-premium.js?v=20260911a"></script>',
              '<script src="ux-v2-bridge.js?v=20260913b"></script>',
          ]
          for tag in tags:
              if tag not in html:
                  html = html.replace('</body>', tag + '</body>')
          if html.index('data-loader.js') > html.index('optimizer.js'):
              raise SystemExit('data-loader.js precisa carregar antes de optimizer.js')
          for page_id in ['time','monte','projecoes','analise','historico','metodologia']:
              if f'id="{page_id}"' not in html:
                  raise SystemExit(f'Aba obrigatoria ausente: {page_id}')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Remover payload pesado do artefato público
        shell: bash
        run: rm -f site/dados.json
      - name: Validar artefato antes do upload
        shell: bash
        run: |
          test -f site/dados-lite.json
          test ! -f site/dados.json
          node --check site/data-loader.js
          node --check site/optimizer.js
          node --check site/time-sugerido-final.js
          node --check site/monte-premium.js
          node --check site/projecoes-premium.js
          node --check site/analise-premium.js
          node --check site/historico-final.js
          node --check site/metodologia-premium.js
          node --check site/ux-v2-bridge.js
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test do site publicado
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}/"
          echo "Validando ${base}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/index.html -w '%{http_code}' "${base}?smoke=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          grep -q 'data-loader.js' /tmp/index.html
          grep -q 'id="time"' /tmp/index.html
          grep -q 'id="monte"' /tmp/index.html
          grep -q 'id="projecoes"' /tmp/index.html
          grep -q 'id="analise"' /tmp/index.html
          grep -q 'id="historico"' /tmp/index.html
          grep -q 'id="metodologia"' /tmp/index.html
          curl -L -sS --fail -o /tmp/dados-lite.json "${base}dados-lite.json?smoke=${GITHUB_RUN_ID}"
          python - <<'PY'
          import json, os
          p='/tmp/dados-lite.json'
          size=os.path.getsize(p)
          if size>5_000_000:
              raise SystemExit(f'Payload publicado acima do limite: {size}')
          d=json.load(open(p,encoding='utf-8'))
          players=d.get('produto',{}).get('jogadores') or []
          required=['produto','explicabilidade_pre_rodada','avaliacao_prospectiva_imutavel','backtest_time_sugerido_walk_forward']
          missing=[k for k in required if k not in d]
          if missing: raise SystemExit('Campos ausentes no publicado: '+', '.join(missing))
          if not players: raise SystemExit('Sem jogadores no payload publicado')
          print(f'Smoke publicado OK: {size} bytes; {len(players)} jogadores')
          PY
          heavy=$(curl -L -sS -o /dev/null -w '%{http_code}' "${base}dados.json?smoke=${GITHUB_RUN_ID}" || true)
          if [ "$heavy" = "200" ]; then
            echo 'ERRO: dados.json pesado ainda está público'
            exit 1
          fi
          curl -L -sS -o /dev/null -w 'index: %{http_code} %{size_download} bytes em %{time_total}s\n' "${base}?perf=${GITHUB_RUN_ID}"
          curl -L -sS -o /dev/null -w 'payload: %{http_code} %{size_download} bytes em %{time_total}s\n' "${base}dados-lite.json?perf=${GITHUB_RUN_ID}"
