name: Atualizar Site Produto V3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/gerar_painel.py'
      - 'scripts/validar_site_produto.py'
      - 'scripts/auditar_otimizador_site.py'
      - 'site/index.html'
      - '.github/workflows/site-produto.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-produto-v3
  cancel-in-progress: true
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências mínimas de validação
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Gerar payload do site
        run: python scripts/gerar_painel.py
      - name: Smoke test funcional do produto
        run: python scripts/validar_site_produto.py
      - name: Auditar máximo global do otimizador
        run: python scripts/auditar_otimizador_site.py
      - name: Publicar dados gerados no main
        run: |
          if git diff --quiet -- site/dados.json; then
            echo 'Sem alteracoes no payload.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/dados.json
          git commit -m 'data: atualizar payload do site v3'
          git pull --rebase origin main
          git push origin HEAD:main
